<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名婚姻分析 - 甄好運姓名學專用</title>
    <style>
        html { -webkit-text-size-adjust: none; text-size-adjust: none; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8f9fa; padding: 15px; text-align: center; color: #333; }
        .input-box { background: white; border: 1px solid #ddd; border-radius: 15px; padding: 20px; max-width: 450px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .name-group { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
        .name-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #800000; }
        input { width: 35%; padding: 12px; margin: 5px; text-align: center; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 85%; padding: 14px; background-color: #800000; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:disabled { background-color: #bbb; cursor: not-allowed; }
        .result-container { display: flex; flex-wrap: nowrap; justify-content: center; gap: 10px; margin-top: 20px; width: 100%; }
        .result-frame { border: 2px solid maroon; border-radius: 15px; padding: 8px 3px; width: 49%; background-color: #FFFBFA; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; box-sizing: border-box; }
        table { margin: 0 auto; border-collapse: collapse; width: 100%; table-layout: fixed; }
        .char-row { height: 60px; }
        .arrow-row { height: 45px; vertical-align: middle; }
        .arrow-row td { height: 45px; padding: 0; }
        .stroke-text { font-size: 11px; color: #aaa; width: 22px; text-align: center; }
        .char-text { font-size: 18px; font-weight: bold; width: 38px; color: black; text-align: center; }
        .num-text { font-size: 17px; color: #483D8B; width: 28px; text-align: center; }
        .wx-text { font-size: 15px; color: #483D8B; width: 25px; text-align: center; }
        .ge-label { font-size: 13px; color: #483D8B; font-weight: bold; width: 38px; text-align: left; }
        .total-box { font-size: 18px; color: darkred; font-weight: bold; margin-top: 15px; border-top: 1.5px solid #ddd; padding-top: 10px; }
        .analysis-box { max-width: 450px; margin: 20px auto; text-align: left; background: #fff; border: 1px solid #800000; border-radius: 10px; padding: 15px; display: block; }
        .analysis-box h3 { color: #800000; margin-top: 0; font-size: 18px; border-bottom: 2px solid #800000; padding-bottom: 5px; }
        .analysis-item { font-size: 16px; margin: 5px 0; color: #333; line-height: 1.5; font-weight: bold; }
        #status { font-size: 13px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 5px; line-height: 1.2;">姓名婚姻分析</h2>
    <div style="font-size: 18px; color: #666; margin-bottom: 15px; font-weight: normal;">甄好運姓名學專用</div>
    <div id="status">正在同步字典數據...</div>

    <div class="input-box">
        <div class="name-group">
            <label>男方姓名</label>
            <input type="text" id="mlName" placeholder="姓" maxlength="2">
            <input type="text" id="mfName" placeholder="名" maxlength="4">
        </div>
        <div class="name-group">
            <label>女方姓名</label>
            <input type="text" id="wlName" placeholder="姓" maxlength="2">
            <input type="text" id="wfName" placeholder="名" maxlength="4">
        </div>
        <button id="btnRun" onclick="analyzeMarriage()" disabled>開始分析</button>
    </div>

    <div class="result-container">
        <div id="mResultFrame" class="result-frame">
            <div class="result-title">男方格局</div>
            <table id="mResultTable"></table>
            <div id="mTotalBox" class="total-box"></div>
        </div>
        <div id="wResultFrame" class="result-frame">
            <div class="result-title">女方格局</div>
            <table id="wResultTable"></table>
            <div id="wTotalBox" class="total-box"></div>
        </div>
    </div>

    <div id="analysisBox" class="analysis-box">
        <h3>分析結果：</h3>
        <div id="analysisList" style="color: #888;">請輸入雙方姓名後點擊「開始分析」</div>
    </div>

    <script>
        let dictionary = {};
        const btn = document.getElementById('btnRun');
        const status = document.getElementById('status');

        function getStrokes(char) {
            const customStrokes = {
                '互': 4, '片': 4, '氏': 4, '及': 4, '之': 4, '王': 4, '瓦': 5, '台': 5, '巡': 6, '卉': 6,
                '廷': 7, '初': 7, '秀': 7, '成': 7, '亞': 8, '武': 8, '昆': 8, '沛': 8, '牧': 8, '弢': 8, '去': 8, '幺': 8,
                '政': 9, '盈': 9, '建': 9, '妍': 9, '致': 9, '修': 9, '哲': 10, '卿': 10, '娜': 10, '育': 10,
                '屏': 11, '胡': 11, '強': 11, '迎': 11, '閏': 11, '一': 11, '弓': 11, '丿': 11,
                '傑': 12, '黃': 12, '盛': 12, '勝': 12, '為': 12, '能': 12, '胸': 12, '涵': 12,
                '溫': 13, '新': 13, '敬': 13, '雋': 13, '淵': 13, '郎': 14, '鳳': 14, '萍': 14, '慈': 14, '嘉': 14,
                '萬': 15, '興': 15, '霈': 15, '數': 15, '寬': 15, '豎': 15, '履': 15, '學': 16, '樺': 16, '璇': 16, '閣': 16, '潔': 16, '頤': 16,
                '鴻': 17, '臨': 17, '燦': 17, '戴': 18, '豐': 18, '珞': 18, '魏': 18, '蕭': 19, '覺': 19, '贊': 19, '羅': 20, '寶': 20, '藏': 20, '譽': 20, '馨': 20,
                '屬': 21, '龔': 22, '響': 22, '霽': 22, '蘭': 23, '麟': 23, '艷': 24
            };
            return customStrokes[char] || dictionary[char] || 0;
        }

        async function loadDict() {
            try {
                const files = ['slim_a.txt', 'slim_b.txt'];
                for (const file of files) {
                    const response = await fetch(file);
                    const data = await response.json();
                    for (let key in data) { dictionary[key] = data[key]; }
                }
                status.innerText = "✅ 字典已就緒";
                btn.disabled = false;
            } catch (err) { status.innerHTML = "❌ 字典載入異常"; }
        }
        loadDict();

        function reduceToSingleDigit(n) {
            while (n >= 10) { n = String(n).split('').reduce((sum, d) => sum + parseInt(d), 0); }
            return n;
        }

        function getWX(n) {
            const map = {1:"木", 2:"木", 3:"火", 4:"火", 5:"土", 6:"土", 7:"金", 8:"金", 9:"水", 0:"水"};
            return map[n % 10];
        }

        function getRelationInfo(up, down) {
            const getIdx = (n) => {
                const t = n % 10;
                if (t==1||t==2) return 0; if (t==3||t==4) return 1;
                if (t==5||t==6) return 2; if (t==7||t==8) return 3; return 4;
            };
            const u = getIdx(up), d = getIdx(down);
            if (u == d) return { type: "無", dir: "" };
            if ((u + 1) % 5 == d) return { type: "生", dir: "下" };
            if ((d + 1) % 5 == u) return { type: "生", dir: "上" };
            const ke = [0, 2, 4, 1, 3];
            const ui = ke.indexOf(u), di = ke.indexOf(d);
            if ((ui + 1) % 5 == di) return { type: "剋", dir: "下" };
            if ((di + 1) % 5 == ui) return { type: "剋", dir: "上" };
            return { type: "無", dir: "" };
        }

        function createArrowSvg(info) {
            if (info.type === "無") return `<svg width="30" height="35" style="display:block; margin:0 auto; visibility:hidden;"></svg>`;
            const head = info.type === "生" ? 
                (info.dir === "下" ? "M -4,-6 L 0,0 L 4,-6" : "M -4,6 L 0,0 L 4,6") :
                (info.dir === "下" ? "M -5,-8 L 5,-8 L 0,2 Z" : "M -5,8 L 5,8 L 0,-2 Z");
            const y = info.dir === "下" ? 30 : 5;
            return `<svg width="30" height="35" style="display:block; margin:0 auto;">
                <line x1="15" y1="5" x2="15" y2="30" stroke="red" stroke-width="1.2" />
                <path d="${head}" fill="${info.type === '生' ? 'none' : 'red'}" stroke="red" stroke-width="1.2" transform="translate(15,${y})" />
            </svg>`;
        }

        function getGirdData(lStr, fStr) {
            let lNameArr = [], fNameArr = [], lStrokes = [], fStrokes = [];
            
            if (/^\d{1,2}$/.test(lStr)) {
                lNameArr = [lStr];
                lStrokes = [parseInt(lStr)];
            } else {
                lNameArr = lStr.split('');
                lStrokes = lNameArr.map(c => getStrokes(c));
            }

            if (/^\d{4}$/.test(fStr)) {
                let n1 = parseInt(fStr.substring(0, 2));
                let n2 = parseInt(fStr.substring(2, 4));
                fNameArr = [fStr.substring(0, 2)];
                fStrokes = [n1];
                if (n2 !== 0) {
                    fNameArr.push(fStr.substring(2, 4));
                    fStrokes.push(n2);
                }
            } else {
                fNameArr = fStr.split('');
                fStrokes = fNameArr.map(c => getStrokes(c));
            }

            const lTotal = lStrokes.reduce((a, b) => a + b, 0);
            const tian = lStrokes.length === 1 ? lStrokes[0] + 1 : lTotal;
            const ren = lTotal + fStrokes[0];
            const di = fStrokes.length === 1 ? fStrokes[0] + 1 : fStrokes[0] + fStrokes[1];
            const zong = lTotal + fStrokes.reduce((a, b) => a + b, 0);

            return { lNameArr, fNameArr, lStrokes, fStrokes, tian, ren, di, zong };
        }

        function buildTableHtml(data) {
            let html = "";
            if (data.lStrokes.length === 1) {
                html += `<tr class="char-row"><td class="stroke-text">${data.lStrokes[0]}</td><td class="char-text">${data.lNameArr[0]}</td><td class="num-text">${data.tian}</td><td class="wx-text">${getWX(data.tian)}</td><td class="ge-label">天格</td></tr>`;
            } else {
                html += `<tr class="char-row"><td class="stroke-text">${data.lStrokes[0]}</td><td class="char-text">${data.lNameArr[0]}</td><td></td><td></td><td></td></tr>`;
                html += `<tr class="char-row"><td class="stroke-text">${data.lStrokes[1]}</td><td class="char-text">${data.lNameArr[1]}</td><td class="num-text">${data.tian}</td><td class="wx-text">${getWX(data.tian)}</td><td class="ge-label">天格</td></tr>`;
            }
            html += `<tr class="arrow-row"><td></td><td></td><td></td><td>${createArrowSvg(getRelationInfo(data.tian, data.ren))}</td><td></td></tr>`;
            html += `<tr class="char-row"><td class="stroke-text">${data.fStrokes[0]}</td><td class="char-text">${data.fNameArr[0]}</td><td class="num-text">${data.ren}</td><td class="wx-text">${getWX(data.ren)}</td><td class="ge-label">人格</td></tr>`;
            html += `<tr class="arrow-row"><td></td><td></td><td></td><td>${createArrowSvg(getRelationInfo(data.ren, data.di))}</td><td></td></tr>`;
            if (data.fStrokes.length > 1) {
                html += `<tr class="char-row"><td class="stroke-text">${data.fStrokes[1]}</td><td class="char-text">${data.fNameArr[1]}</td><td class="num-text">${data.di}</td><td class="wx-text">${getWX(data.di)}</td><td class="ge-label">地格</td></tr>`;
            } else {
                html += `<tr class="char-row"><td class="stroke-text">1</td><td></td><td class="num-text">${data.di}</td><td class="wx-text">${getWX(data.di)}</td><td class="ge-label">地格</td></tr>`;
            }
            return html;
        }

        function analyzeMarriage() {
            const mData = getGirdData(document.getElementById('mlName').value.trim(), document.getElementById('mfName').value.trim());
            const wData = getGirdData(document.getElementById('wlName').value.trim(), document.getElementById('wfName').value.trim());

            document.getElementById('mResultTable').innerHTML = buildTableHtml(mData);
            document.getElementById('mTotalBox').innerText = "總格 ： " + mData.zong;
            document.getElementById('mResultFrame').style.display = "block";

            document.getElementById('wResultTable').innerHTML = buildTableHtml(wData);
            document.getElementById('wTotalBox').innerText = "總格 ： " + wData.zong;
            document.getElementById('wResultFrame').style.display = "block";

            let rawResults = []; 

            // --- 規則 1：坐入 ---
            const checkZuoru = (v1, v2) => (v1 === v2) || (reduceToSingleDigit(v1) === reduceToSingleDigit(v2));
            if (checkZuoru(mData.ren, wData.di) || checkZuoru(wData.ren, mData.di) || checkZuoru(mData.di, wData.zong) || checkZuoru(wData.di, mData.zong)) {
                rawResults.push("坐入");
            }

            // --- 五行與汽化變數準備 ---
            const mRenD = reduceToSingleDigit(mData.ren);
            const mDiD = reduceToSingleDigit(mData.di);
            const wRenD = reduceToSingleDigit(wData.ren);
            const wDiD = reduceToSingleDigit(wData.di);

            const mRenWx = getWX(mRenD);
            const mDiWx = getWX(mDiD);
            const wRenWx = getWX(wRenD);
            const wDiWx = getWX(wDiD);

            // 原本五行
            const mTianWxOrig = getWX(mData.tian);
            const mRenWxOrig = getWX(mData.ren);
            const mDiWxOrig = getWX(mData.di);

            const wTianWxOrig = getWX(wData.tian);
            const wRenWxOrig = getWX(wData.ren);
            const wDiWxOrig = getWX(wData.di);

            // --- 規則 2：對流 ---
            if (mRenWx === wDiWx && mDiWx === wRenWx) {
                if (mRenWx === mDiWx) {
                    if (mRenD === wDiD && mDiD === wRenD && mRenD !== mDiD) {
                        rawResults.push("對流");
                    }
                } else {
                    rawResults.push("對流");
                }
            }

            // --- 規則 3：另類搭配 ---
            function getXiang(ren, di) {
                const r = reduceToSingleDigit(ren);
                const d = reduceToSingleDigit(di);
                const wr = getWX(r);
                const wd = getWX(d);
                if (wr === wd) {
                    return (r === d) ? "平雙" : "陰陽雙";
                }
                const rel = getRelationInfo(r, d);
                if (rel.type === "生" && rel.dir === "上") {
                    return "淡象";
                }
                return "無";
            }
            const mXiang = getXiang(mData.ren, mData.di);
            const wXiang = getXiang(wData.ren, wData.di);

            if ((mXiang === "平雙" && wXiang === "淡象") || (wXiang === "平雙" && mXiang === "淡象")) {
                rawResults.push("另類搭配(平雙配淡象)");
            } else if ((mXiang === "陰陽雙" && wXiang === "平雙") || (wXiang === "陰陽雙" && mXiang === "平雙")) {
                rawResults.push("另類搭配(陰陽雙配平雙)");
            }

            // --- 規則 4：形影不離 (修正：無方向性對應) ---
            function checkXingYing(vapU_wx, vapD_wx, targetPairs) {
                const wxArr = ["木", "火", "土", "金", "水"];
                const u = wxArr.indexOf(vapU_wx);
                const d = wxArr.indexOf(vapD_wx);
                let highest = null;

                const isSheng = ((u + 1) % 5 === d) || ((d + 1) % 5 === u);

                // 核心邏輯：判斷兩個五行集合是否相同 (不考慮方向)
                const matchPair = (a1, b1, a2, b2) => {
                    return (a1 === a2 && b1 === b2) || (a1 === b2 && b1 === a2);
                };

                for (let pair of targetPairs) {
                    const tU = wxArr.indexOf(pair[0]);
                    const tD = wxArr.indexOf(pair[1]);

                    if (isSheng) {
                        // 推演下一階：雙方同時前進一步
                        const nextU = (u + 1) % 5;
                        const nextD = (d + 1) % 5;

                        if (matchPair(nextU, nextD, tU, tD)) {
                            highest = "全"; // 找到完全對應的下一階
                        } else if (matchPair(u, d, tU, tD)) {
                            if (highest !== "全") highest = "一半"; // 原階對應
                        }
                    } else {
                        // 剋宮或平宮：直接對應原本五行集合
                        if (matchPair(u, d, tU, tD)) {
                            highest = "全";
                        }
                    }
                }
                return highest;
            }

            // 準備對方的原本關係對
            const targetPairsForM = [[wTianWxOrig, wRenWxOrig], [wRenWxOrig, wDiWxOrig]];
            const targetPairsForW = [[mTianWxOrig, mRenWxOrig], [mRenWxOrig, mDiWxOrig]];

            // 男方汽化 vs 女方原本
            const xy1 = checkXingYing(mRenWx, mDiWx, targetPairsForM);
            // 女方汽化 vs 男方原本
            const xy2 = checkXingYing(wRenWx, wDiWx, targetPairsForW);

            if (xy1 === "全" || xy2 === "全") {
                rawResults.push("形影不離(全)");
            } else if (xy1 === "一半" || xy2 === "一半") {
                rawResults.push("形影不離(一半)");
            }

            // --- 渲染結果清單 ---
            const aList = document.getElementById('analysisList');
            if (rawResults.length > 0) {
                aList.innerHTML = rawResults.map((res, index) => `<div class="analysis-item">${index + 1}. ${res}</div>`).join('');
            } else {
                aList.innerHTML = `<div class="analysis-item" style="color: #888; font-weight: normal;">(此組合尚無特殊關係)</div>`;
            }
        }
    </script>
</body>
</html>
