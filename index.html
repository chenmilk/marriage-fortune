<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名婚姻分析 - 甄好運姓名學專用</title>
    <style>
        /* 強制不隨手機系統縮放字體，防止跑版 */
        html { -webkit-text-size-adjust: none; text-size-adjust: none; }

        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8f9fa; padding: 15px; text-align: center; color: #333; }
        .input-box { background: white; border: 1px solid #ddd; border-radius: 15px; padding: 20px; max-width: 450px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .name-group { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
        .name-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #800000; }
        input { width: 35%; padding: 12px; margin: 5px; text-align: center; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; }
        
        button { width: 85%; padding: 14px; background-color: #800000; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:disabled { background-color: #bbb; cursor: not-allowed; }
        
        .result-container { 
            display: flex; 
            flex-wrap: nowrap; 
            justify-content: center; 
            gap: 10px; 
            margin-top: 20px;
            width: 100%;
        }
        
        /* 縮小表格間距，讓內容更緊湊 */
        .result-frame { 
            border: 2px solid maroon; 
            border-radius: 15px; 
            padding: 8px 5px; /* 縮小內邊距 */
            width: 49%; 
            background-color: #FFFBFA; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: none; 
            box-sizing: border-box;
        }

        table { 
            margin: 0 auto; 
            border-collapse: collapse; 
            width: 100%; 
            table-layout: fixed; /* 固定佈局 */
        }

        /* 精確控制每一欄的寬度，縮小空格 */
        .stroke-text { font-size: 11px; color: #aaa; width: 22px; text-align: center; }
        .char-text { font-size: 20px; font-weight: bold; width: 40px; color: black; text-align: center; }
        .num-text { font-size: 17px; color: #483D8B; width: 30px; text-align: center; }
        .wx-text { font-size: 15px; color: #483D8B; width: 28px; text-align: center; }
        .ge-label { font-size: 13px; color: #483D8B; font-weight: bold; width: 40px; text-align: left; }
        
        .total-box { font-size: 18px; color: darkred; font-weight: bold; margin-top: 15px; border-top: 1.5px solid #ddd; padding-top: 10px; }
        
        /* 分析結果顯示區 */
        .analysis-box {
            max-width: 450px;
            margin: 20px auto;
            text-align: left;
            background: #fff;
            border: 1px solid #800000;
            border-radius: 10px;
            padding: 15px;
            display: block; /* 確保框框固定出現 */
        }
        .analysis-box h3 { color: #800000; margin-top: 0; font-size: 18px; border-bottom: 2px solid #800000; padding-bottom: 5px; }
        .analysis-item { font-size: 16px; margin: 5px 0; color: #333; line-height: 1.5; }

        #status { font-size: 13px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2 style="margin-bottom: 5px; line-height: 1.2;">姓名婚姻分析</h2>
    <div style="font-size: 18px; color: #666; margin-bottom: 15px; font-weight: normal;">甄好運姓名學專用</div>
    <div id="status">正在同步字典數據...</div>

    <div class="input-box">
        <div class="name-group">
            <label>男方姓名</label>
            <input type="text" id="mlName" placeholder="姓" maxlength="2">
            <input type="text" id="mfName" placeholder="名" maxlength="2">
        </div>
        <div class="name-group">
            <label>女方姓名</label>
            <input type="text" id="wlName" placeholder="姓" maxlength="2">
            <input type="text" id="wfName" placeholder="名" maxlength="2">
        </div>
        <button id="btnRun" onclick="analyzeMarriage()" disabled>開始分析</button>
    </div>

    <div class="result-container">
        <div id="mResultFrame" class="result-frame">
            <div class="result-title">男方格局</div>
            <table id="mResultTable"></table>
            <div id="mTotalBox" class="total-box"></div>
        </div>
        <div id="wResultFrame" class="result-frame">
            <div class="result-title">女方格局</div>
            <table id="wResultTable"></table>
            <div id="wTotalBox" class="total-box"></div>
        </div>
    </div>

    <div id="analysisBox" class="analysis-box">
        <h3>分析結果：</h3>
        <div id="analysisList" style="color: #888;">請輸入雙方姓名後點擊「開始分析」</div>
    </div>

    <script>
        let dictionary = {};
        const btn = document.getElementById('btnRun');
        const status = document.getElementById('status');

        function getStrokes(char) {
            const customStrokes = {
                '互': 4, '片': 4, '氏': 4, '及': 4, '之': 4, '王': 4, '瓦': 5, '台': 5, '巡': 6, '卉': 6,
                '廷': 7, '初': 7, '秀': 7, '成': 7, '亞': 8, '武': 8, '昆': 8, '沛': 8, '牧': 8, '弢': 8, '去': 8, '幺': 8,
                '政': 9, '盈': 9, '建': 9, '妍': 9, '致': 9, '修': 9, '哲': 10, '卿': 10, '娜': 10, '育': 10,
                '屏': 11, '胡': 11, '強': 11, '迎': 11, '閏': 11, '一': 11, '弓': 11, '丿': 11,
                '傑': 12, '黃': 12, '盛': 12, '勝': 12, '為': 12, '能': 12, '胸': 12, '涵': 12,
                '溫': 13, '新': 13, '敬': 13, '雋': 13, '淵': 13, '郎': 14, '鳳': 14, '萍': 14, '慈': 14, '嘉': 14,
                '萬': 15, '興': 15, '霈': 15, '數': 15, '寬': 15, '豎': 15, '履': 15, '學': 16, '樺': 16, '璇': 16, '閣': 16, '潔': 16, '頤': 16,
                '鴻': 17, '臨': 17, '燦': 17, '戴': 18, '豐': 18, '珞': 18, '魏': 18, '蕭': 19, '覺': 19, '贊': 19, '羅': 20, '寶': 20, '藏': 20, '譽': 20, '馨': 20,
                '屬': 21, '龔': 22, '響': 22, '霽': 22, '蘭': 23, '麟': 23, '艷': 24
            };
            return customStrokes[char] || dictionary[char] || 0;
        }

        async function loadDict() {
            try {
                const files = ['slim_a.txt', 'slim_b.txt'];
                for (const file of files) {
                    const response = await fetch(file);
                    const data = await response.json();
                    for (let key in data) { dictionary[key] = data[key]; }
                }
                status.innerText = "✅ 字典已就緒";
                btn.disabled = false;
            } catch (err) {
                status.innerHTML = "❌ 字典載入異常";
            }
        }
        loadDict();

        // 遞迴將數字相加直到變成個位數 (如 29 -> 11 -> 2)
        function reduceToSingleDigit(n) {
            while (n >= 10) {
                n = String(n).split('').reduce((sum, d) => sum + parseInt(d), 0);
            }
            return n;
        }

        function getWX(n) {
            const map = {1:"木", 2:"木", 3:"火", 4:"火", 5:"土", 6:"土", 7:"金", 8:"金", 9:"水", 0:"水"};
            return map[n % 10];
        }

        function getRelationInfo(up, down) {
            const getIdx = (n) => {
                const t = n % 10;
                if (t==1||t==2) return 0; if (t==3||t==4) return 1;
                if (t==5||t==6) return 2; if (t==7||t==8) return 3; return 4;
            };
            const u = getIdx(up), d = getIdx(down);
            if (u == d) return { type: "無", dir: "" };
            if ((u + 1) % 5 == d) return { type: "生", dir: "下" };
            if ((d + 1) % 5 == u) return { type: "生", dir: "上" };
            const ke = [0, 2, 4, 1, 3];
            const ui = ke.indexOf(u), di = ke.indexOf(d);
            if ((ui + 1) % 5 == di) return { type: "剋", dir: "下" };
            if ((di + 1) % 5 == ui) return { type: "剋", dir: "上" };
            return { type: "無", dir: "" };
        }

        function createArrowSvg(info) {
            if (info.type === "無") return "";
            const head = info.type === "生" ? 
                (info.dir === "下" ? "M -4,-6 L 0,0 L 4,-6" : "M -4,6 L 0,0 L 4,6") :
                (info.dir === "下" ? "M -5,-8 L 5,-8 L 0,2 Z" : "M -5,8 L 5,8 L 0,-2 Z");
            const y = info.dir === "下" ? 30 : 5;
            return `<svg width="30" height="35" style="display:block; margin:0 auto;">
                <line x1="15" y1="5" x2="15" y2="30" stroke="red" stroke-width="1.2" />
                <path d="${head}" fill="${info.type === '生' ? 'none' : 'red'}" stroke="red" stroke-width="1.2" transform="translate(15,${y})" />
            </svg>`;
        }

        function getGirdInfo(last, first) {
            const l1 = getStrokes(last[0]), l2 = last.length > 1 ? getStrokes(last[1]) : 0;
            const f1 = getStrokes(first[0]), f2 = first.length > 1 ? getStrokes(first[1]) : 0;
            return {
                tian: last.length == 1 ? l1 + 1 : l1 + l2,
                ren: (l1 + l2) + f1,
                di: first.length == 1 ? f1 + 1 : f1 + f2,
                zong: l1 + l2 + f1 + f2,
                l1, l2, f1, f2
            };
        }

        function buildTableHtml(last, first, info) {
            let html = "";
            if (last.length == 1) {
                html += `<tr class="char-row"><td class="stroke-text">${info.l1}</td><td class="char-text">${last[0]}</td><td class="num-text">${info.tian}</td><td class="wx-text">${getWX(info.tian)}</td><td class="ge-label">天格</td></tr>`;
            } else {
                html += `<tr class="char-row"><td class="stroke-text">${info.l1}</td><td class="char-text">${last[0]}</td><td></td><td></td><td></td></tr>`;
                html += `<tr class="char-row"><td class="stroke-text">${info.l2}</td><td class="char-text">${last[1]}</td><td class="num-text">${info.tian}</td><td class="wx-text">${getWX(info.tian)}</td><td class="ge-label">天格</td></tr>`;
            }
            html += `<tr class="arrow-row"><td></td><td></td><td></td><td>${createArrowSvg(getRelationInfo(info.tian, info.ren))}</td><td></td></tr>`;
            html += `<tr class="char-row"><td class="stroke-text">${info.f1}</td><td class="char-text">${first[0]}</td><td class="num-text">${info.ren}</td><td class="wx-text">${getWX(info.ren)}</td><td class="ge-label">人格</td></tr>`;
            html += `<tr class="arrow-row"><td></td><td></td><td></td><td>${createArrowSvg(getRelationInfo(info.ren, info.di))}</td><td></td></tr>`;
            if (first.length > 1) {
                html += `<tr class="char-row"><td class="stroke-text">${info.f2}</td><td class="char-text">${first[1]}</td><td class="num-text">${info.di}</td><td class="wx-text">${getWX(info.di)}</td><td class="ge-label">地格</td></tr>`;
            } else {
                html += `<tr class="char-row"><td class="stroke-text">1</td><td></td><td class="num-text">${info.di}</td><td class="wx-text">${getWX(info.di)}</td><td class="ge-label">地格</td></tr>`;
            }
            return html;
        }

        function analyzeMarriage() {
            const ml = document.getElementById('mlName').value.trim();
            const mf = document.getElementById('mfName').value.trim();
            const wl = document.getElementById('wlName').value.trim();
            const wf = document.getElementById('wfName').value.trim();

            if (!ml || !mf || !wl || !wf) {
                alert("請完整輸入姓名");
                return;
            }

            const mInfo = getGirdInfo(ml, mf);
            const wInfo = getGirdInfo(wl, wf);

            document.getElementById('mResultTable').innerHTML = buildTableHtml(ml, mf, mInfo);
            document.getElementById('mTotalBox').innerText = "總格 ： " + mInfo.zong;
            document.getElementById('mResultFrame').style.display = "block";

            document.getElementById('wResultTable').innerHTML = buildTableHtml(wl, wf, wInfo);
            document.getElementById('wTotalBox').innerText = "總格 ： " + wInfo.zong;
            document.getElementById('wResultFrame').style.display = "block";

            // --- 婚姻邏輯分析 ---
            let analysisResults = [];

            // 坐入檢查邏輯
            const checkZuoru = (val1, val2) => {
                return (val1 === val2) || (reduceToSingleDigit(val1) === reduceToSingleDigit(val2));
            };

            let hasZuoru = false;
            // 規則：人格對地格，或地格對總格
            if (checkZuoru(mInfo.ren, wInfo.di) || checkZuoru(wInfo.ren, mInfo.di) || 
                checkZuoru(mInfo.di, wInfo.zong) || checkZuoru(wInfo.di, mInfo.zong)) {
                hasZuoru = true;
            }

            if (hasZuoru) {
                analysisResults.push("1. 坐入");
            } else {
                // 如果未來有其他規則，這裡會補上，目前先放個佔位符確保 1. 不會消失
                // analysisResults.push("1. (其他分析結果)"); 
            }

           // 渲染分析結果清單
            const aList = document.getElementById('analysisList');
            
            if (analysisResults.length > 0) {
                // 如果有符合「坐入」或其他規則，顯示結果
                aList.innerHTML = analysisResults.map(res => `<div class="analysis-item">${res}</div>`).join('');
            } else {
                // 如果完全沒有符合，顯示特定的文字，讓「分析結果：」下方不留白
                aList.innerHTML = `<div class="analysis-item" style="color: #888;">(此組合尚無特殊坐入關係)</div>`;
            }
        }
    </script>
</body>
</html>
